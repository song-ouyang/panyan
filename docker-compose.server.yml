name: wanpan-diary

services:
  postgres:
    # Debian/glibc avoids the Alpine/musl syscall path rejected by Docker's
    # default seccomp stack on the legacy CentOS 7 host.
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      # Keep fresh installs below the named-volume mount root. The fallback
      # stays at the historical root so an older valid cluster is never hidden.
      PGDATA: ${POSTGRES_PGDATA:-/var/lib/postgresql/data}
      POSTGRES_DB: ${POSTGRES_DB:-wanpan}
      POSTGRES_USER: ${POSTGRES_USER:-wanpan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks: [internal]

  api:
    image: wanpan-diary-api:${API_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-wanpan}
      PGUSER: ${POSTGRES_USER:-wanpan}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_BASE_URL: https://${DOMAIN}
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?请设置 WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?请设置 WECHAT_APP_SECRET}
      WECHAT_MOBILE_APP_ID: ${WECHAT_MOBILE_APP_ID:-}
      WECHAT_MOBILE_APP_SECRET: ${WECHAT_MOBILE_APP_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-com.wanpan.wanpanDiary}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APP_REVIEW_LOGIN_PHONE: ${APP_REVIEW_LOGIN_PHONE:-}
      APP_REVIEW_LOGIN_CODE: ${APP_REVIEW_LOGIN_CODE:-}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      ALIYUN_SMS_TEMPLATE_MIN: ${ALIYUN_SMS_TEMPLATE_MIN:-5}
      MODERATION_MODE: ${MODERATION_MODE:-manual}
      UPLOAD_MODE: ${UPLOAD_MODE:-local}
      OSS_REGION: ${OSS_REGION:-oss-cn-chengdu}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
    command: ["sh", "-c", "node server/dist/db/migrate.js && node server/dist/index.js"]
    init: true
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3100}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  uploads:
