}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
#wanpan-sound-audition { --wsa-cream:#fff5e6; --wsa-paper:#fffaf2; --wsa-ink:#302d29; --wsa-muted:#796e61; --wsa-coral:#fa704f; --wsa-line:#e8d9c6; --wsa-mint:#79bfa2; font-family:-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif; color:var(--wsa-ink); }
#wanpan-sound-audition * { box-sizing:border-box; }
#wanpan-sound-audition .wsa-panel { max-width:440px; margin:0 auto; padding:22px; background:var(--wsa-cream); border:1px solid var(--wsa-line); border-radius:30px; }
#wanpan-sound-audition .wsa-header { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13px; line-height:1.5; }
#wanpan-sound-audition .wsa-brand { display:flex; align-items:center; gap:7px; font-weight:500; }
#wanpan-sound-audition .wsa-dot { width:7px; height:7px; border-radius:50%; background:var(--wsa-coral); }
#wanpan-sound-audition .wsa-level { color:#954b35; background:#ffe2cb; border-radius:16px; padding:4px 10px; font-size:12px; }
#wanpan-sound-audition .wsa-stage { text-align:center; margin:5px 0 20px; }
#wanpan-sound-audition .wsa-art { width:200px; height:200px; max-width:100%; position:relative; isolation:isolate; margin:0 auto; }
#wanpan-sound-audition .wsa-badge { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply; border-radius:50%; z-index:2; }
#wanpan-sound-audition .wsa-ring { position:absolute; inset:23%; border:3px solid #e9ac61; border-radius:50%; opacity:0; z-index:0; }
#wanpan-sound-audition .wsa-particle { position:absolute; width:6px; height:9px; border-radius:3px; background:var(--wsa-coral); left:50%; top:50%; opacity:0; z-index:3; }
#wanpan-sound-audition .wsa-particle:nth-child(2n) { background:#d6a44e; width:7px; height:7px; border-radius:50%; }
#wanpan-sound-audition .wsa-particle:nth-child(3n) { background:var(--wsa-mint); }
#wanpan-sound-audition .wsa-heading { font-size:23px; line-height:1.35; font-weight:500; margin:-1px 0 5px; letter-spacing:1px; }
#wanpan-sound-audition .wsa-caption { font-size:12px; line-height:1.6; color:var(--wsa-muted); margin:0; }
#wanpan-sound-audition .wsa-options { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
#wanpan-sound-audition .wsa-choice { text-align:left; position:relative; padding:13px 12px; border:1px solid var(--wsa-line); background:var(--wsa-paper); color:var(--wsa-ink); border-radius:15px; font:inherit; cursor:pointer; min-height:78px; }
#wanpan-sound-audition .wsa-choice[aria-pressed=&quot;true&quot;] { border-color:#c77852; background:#ffe7d2; box-shadow:inset 0 0 0 1px #c77852; }
#wanpan-sound-audition .wsa-choice-head { display:flex; align-items:center; flex-wrap:wrap; gap:5px; font-size:13px; line-height:1.5; font-weight:500; }
#wanpan-sound-audition .wsa-letter { color:#9b4931; margin-right:1px; }
#wanpan-sound-audition .wsa-recommend { font-size:11px; line-height:1.5; border-radius:6px; padding:1px 4px; background:#a34c33; color:#fffaf2; }
#wanpan-sound-audition .wsa-choice-meta { margin-top:5px; color:var(--wsa-muted); display:flex; justify-content:space-between; gap:8px; font-size:11px; line-height:1.5; }
#wanpan-sound-audition .wsa-state { display:block; text-align:center; min-height:20px; margin:12px 0 11px; font-size:12px; line-height:1.6; color:var(--wsa-muted); }
#wanpan-sound-audition[data-state=&quot;error&quot;] .wsa-state { color:#ac3b29; }
#wanpan-sound-audition .wsa-replay { display:block; width:100%; border:0; border-radius:15px; padding:12px 16px; min-height:46px; background:var(--wsa-coral); color:#2e211b; font:500 14px/1.5 inherit; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; box-shadow:0 3px 0 #d65d40; }
#wanpan-sound-audition .wsa-replay:active { transform:translateY(2px); box-shadow:0 1px 0 #d65d40; }
#wanpan-sound-audition .wsa-controls { margin-top:18px; display:flex; gap:18px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
#wanpan-sound-audition .wsa-volume { display:block; flex:1 1 145px; font-size:12px; line-height:1.5; }
#wanpan-sound-audition .wsa-volume-label { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; gap:8px; }
#wanpan-sound-audition .wsa-slider { width:100%; margin:0; display:block; accent-color:#c45b3f; height:24px; }
#wanpan-sound-audition .wsa-reduced-label { display:flex; gap:6px; align-items:center; min-height:44px; font-size:12px; line-height:1.5; white-space:nowrap; }
#wanpan-sound-audition .wsa-reduced-label input { accent-color:#c45b3f; width:16px; height:16px; margin:0; }
#wanpan-sound-audition.wsa-playing .wsa-badge { animation:wsa-badge-in 1.1s both; }
#wanpan-sound-audition.wsa-playing .wsa-ring { animation:wsa-ring-out 1.1s both; }
#wanpan-sound-audition.wsa-playing .wsa-particle { animation:wsa-confetti 1.1s both; }
#wanpan-sound-audition.wsa-playing .wsa-reveal { animation:wsa-copy-in 1.1s both; }
#wanpan-sound-audition.wsa-reduced .wsa-badge,#wanpan-sound-audition.wsa-reduced .wsa-ring,#wanpan-sound-audition.wsa-reduced .wsa-particle,#wanpan-sound-audition.wsa-reduced .wsa-reveal { animation:none!important; }
@keyframes wsa-badge-in { 0% { opacity:0; transform:translateY(30px) rotate(-10deg) scale(.68); } 12% { opacity:1; } 41% { opacity:1; transform:translateY(-4px) rotate(3deg) scale(1.06); animation-timing-function:ease-out; } 82%,100% { opacity:1; transform:translateY(0) rotate(0) scale(1); } }
@keyframes wsa-ring-out { 0%,12% { opacity:0; transform:scale(.6); } 30% { opacity:.7; } 80%,100% { opacity:0; transform:scale(2.35); } }
@keyframes wsa-confetti { 0%,20% { opacity:0; transform:translate(-50%,-50%) scale(.2); } 34% { opacity:.85; } 86%,100% { opacity:0; transform:translate(calc(-50% + var(--wsa-x)),calc(-50% + var(--wsa-y))) rotate(var(--wsa-turn)) scale(.7); } }
@keyframes wsa-copy-in { 0%,42% { opacity:0; transform:translateY(8px); } 77%,100% { opacity:1; transform:translateY(0); } }
@media (max-width:380px) { #wanpan-sound-audition .wsa-panel { padding:18px 15px; border-radius:25px; } #wanpan-sound-audition .wsa-options { gap:8px; } #wanpan-sound-audition .wsa-choice { padding:12px 10px; } #wanpan-sound-audition .wsa-recommend { display:none; } #wanpan-sound-audition .wsa-choice:first-child .wsa-choice-meta:before { content:&quot;推荐&quot;; color:#9b4931; } #wanpan-sound-audition .wsa-choice:first-child .wsa-tone { display:none; } #wanpan-sound-audition .wsa-art { width:180px; height:180px; } }

  const skipDelay = 300;

  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;

    target?.nodeType === Node.ELEMENT_NODE

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;

    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;

      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      getContent(trigger).length === 0 ||
